name: DropNotch
options:
  bundleIdPrefix: com.shashwat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Shown in Xcode's navigator for reference only; not members of any target.
fileGroups:
  - CLAUDE.md
  - TASK.md
  - docs
packages:
  # MIT; licence and pin recorded in docs/DECISIONS.md D10a.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
targets:
  DropNotch:
    type: application
    platform: macOS
    sources: [DropNotch]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: DropNotch/Info.plist
      properties:
        CFBundleDisplayName: DropNotch
        # Agent app: no Dock icon or app menu.
        LSUIElement: true
        NSAppleEventsUsageDescription: DropNotch uses this to show what is playing in Music and Spotify and to control playback from the notch.
    # No App Sandbox (D4). Under the hardened runtime, sending Apple Events to other apps
    # (Music, Spotify) needs this entitlement (D2).
    entitlements:
      path: DropNotch/DropNotch.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shashwat.DropNotch
        # Set for all configurations (D4). Xcode still omits the runtime when signing Debug
        # ad hoc: with no Team ID, library validation would reject the app's own debug dylib (D11).
        ENABLE_HARDENED_RUNTIME: YES
  DropNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DropNotchTests]
    dependencies:
      - target: DropNotch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shashwat.DropNotchTests
schemes:
  DropNotch:
    build:
      targets:
        DropNotch: all
    test:
      targets: [DropNotchTests]
