name: DropNotch
options:
  bundleIdPrefix: com.shashwat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Shown in Xcode's navigator for reference only; not members of any target.
fileGroups:
  - CLAUDE.md
  - TASK.md
  - docs
packages:
  # Pinned by commit, not tag: a tag can be moved (D48, design review M5). make-dmg.sh checks what resolves.
  # MIT; licence recorded in docs/DECISIONS.md D10a. Tag 3.1.0.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    revision: 772133d9dbe800fdac0473226822994c5c162c58
  # MIT; licence recorded in docs/DECISIONS.md D48. Tag v1.99.3. Runs a build-tool plugin: xcodebuild needs
  # -skipPackagePluginValidation, Xcode needs "Trust & Enable" once.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 282c3c3a932b55c129628876b70f37d993af1615
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_IDENTITY: "-"
targets:
  DropNotch:
    type: application
    platform: macOS
    sources:
      - DropNotch
      # Licence notices for bundled packages ship inside the app (MIT requires it).
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: DropNotch/Info.plist
      properties:
        CFBundleDisplayName: DropNotch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Agent app: no Dock icon or app menu.
        LSUIElement: true
        # Covers the reads of the track, artwork and position (D23, D26) as well as the controls. Commands in the
        # Terminal tab run with DropNotch's permissions, so they can cause this prompt too (D48; wording by Shash).
        NSAppleEventsUsageDescription: "DropNotch uses this to show what's playing in Music and Spotify and to send play, pause, skip and seek from the notch. If you're using DropNotch's Terminal tab, a command you ran there may be the one asking: commands there use DropNotch's access."
        # Asked only from the Calendar card's Allow button or when the card is turned on in Settings (D44). macOS 14 has
        # no read-only level, so this is the full-access key; the card only reads.
        NSCalendarsFullAccessUsageDescription: "DropNotch shows your upcoming events on the Home tab; the Calendar card only reads them. Commands you run in DropNotch's Terminal tab get this access too, and they can add, change or delete events. Nothing leaves your Mac unless a command you run sends it."
        # Shown when the tray first opens a file kept in one of these folders (D32, RISKS.md §2), or when a command in
        # the Terminal tab first touches one (D48).
        NSDesktopFolderUsageDescription: "DropNotch uses this to keep files you drop on the notch in the tray. If you're using DropNotch's Terminal tab, a command you ran there may be the one asking: commands there use DropNotch's access."
        NSDocumentsFolderUsageDescription: "DropNotch uses this to keep files you drop on the notch in the tray. If you're using DropNotch's Terminal tab, a command you ran there may be the one asking: commands there use DropNotch's access."
        NSDownloadsFolderUsageDescription: "DropNotch uses this to keep files you drop on the notch in the tray. If you're using DropNotch's Terminal tab, a command you ran there may be the one asking: commands there use DropNotch's access."
        # Asked only when "Show headphone battery when they connect" is turned on (D54): IOBluetooth reads need it.
        NSBluetoothAlwaysUsageDescription: "DropNotch reads the battery level of headphones such as AirPods when they connect, to show it in the notch. It never connects to, changes or records any device."
        # Only a command in the Terminal tab can cause this prompt: DropNotch itself never uses the local network (D48).
        NSLocalNetworkUsageDescription: "A command you ran in DropNotch's Terminal tab wants to find or connect to devices on your local network. DropNotch itself never uses your local network."
    # No App Sandbox (D4). Under the hardened runtime, sending Apple Events to other apps
    # (Music, Spotify) needs the apple-events entitlement (D2), and reading calendars needs the calendars one (D44).
    # Both are resource access, not runtime exceptions. Debug has no hardened runtime (D11): test them in Release.
    entitlements:
      path: DropNotch/DropNotch.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shashwat.DropNotch
        # DropNotch/Assets.xcassets; regenerate with scripts/app-icon/make-icons.sh (D38).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set for all configurations (D4). Xcode still omits the runtime when signing Debug
        # ad hoc: with no Team ID, library validation would reject the app's own debug dylib (D11).
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Stop Xcode adding get-task-allow (debugger attach) to Release: it would expose the
        # app's memory to same-user processes, and notarisation requires it absent (D13). Debug keeps it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  DropNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DropNotchTests]
    dependencies:
      - target: DropNotch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shashwat.DropNotchTests
schemes:
  DropNotch:
    build:
      targets:
        DropNotch: all
    test:
      targets: [DropNotchTests]
