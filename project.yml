name: DropNotch
options:
  bundleIdPrefix: com.shashwat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Shown in Xcode's navigator for reference only; not members of any target.
fileGroups:
  - CLAUDE.md
  - TASK.md
  - docs
packages:
  # MIT; licence and pin recorded in docs/DECISIONS.md D10a.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
targets:
  DropNotch:
    type: application
    platform: macOS
    sources:
      - DropNotch
      # Licence notices for bundled packages ship inside the app (MIT requires it).
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: DropNotch/Info.plist
      properties:
        CFBundleDisplayName: DropNotch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Agent app: no Dock icon or app menu.
        LSUIElement: true
        # Covers the reads of the track, artwork and position (D23, D26) as well as the controls.
        # Shown when the tray first opens a file kept in one of these folders (D32, RISKS.md §2).
        NSDesktopFolderUsageDescription: DropNotch keeps a link to files you drop on the notch, so they stay in the tray.
        NSDocumentsFolderUsageDescription: DropNotch keeps a link to files you drop on the notch, so they stay in the tray.
        NSDownloadsFolderUsageDescription: DropNotch keeps a link to files you drop on the notch, so they stay in the tray.
        NSAppleEventsUsageDescription: DropNotch shows the current track, its artwork and progress from Music and Spotify, and sends play, pause, skip and seek commands when you use the controls in the notch.
    # No App Sandbox (D4). Under the hardened runtime, sending Apple Events to other apps
    # (Music, Spotify) needs this entitlement (D2).
    entitlements:
      path: DropNotch/DropNotch.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shashwat.DropNotch
        # Set for all configurations (D4). Xcode still omits the runtime when signing Debug
        # ad hoc: with no Team ID, library validation would reject the app's own debug dylib (D11).
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Stop Xcode adding get-task-allow (debugger attach) to Release: it would expose the
        # app's memory to same-user processes, and notarisation requires it absent (D13). Debug keeps it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  DropNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DropNotchTests]
    dependencies:
      - target: DropNotch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shashwat.DropNotchTests
schemes:
  DropNotch:
    build:
      targets:
        DropNotch: all
    test:
      targets: [DropNotchTests]
